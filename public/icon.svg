<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="labBg" cx="48%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#132544" />
      <stop offset="55%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#060911" />
    </radialGradient>
    <radialGradient id="flaskAura" cx="50%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassBody" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="liquidVol" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="orbitGoldBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="orbitGoldFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Midnight Lab Background & Radial Volumetric Glow -->
  <rect width="512" height="512" rx="112" fill="url(#labBg)" />
  <circle cx="256" cy="278" r="215" fill="url(#flaskAura)" />

  <!-- Back Half of 3D Atomic Orbitals (occluded behind flask) -->
  <g transform="translate(256 286)">
    <path d="M -161 0 A 161 57 0 0 1 161 0" transform="rotate(-28)" fill="none" stroke="url(#orbitGoldBack)" stroke-width="9" stroke-linecap="round" />
    <path d="M -161 0 A 161 57 0 0 1 161 0" transform="rotate(28)" fill="none" stroke="url(#orbitGoldBack)" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Erlenmeyer Flask 3D Glass Silhouette -->
  <path d="M214 98h84v18l-10 8v68l98 170c10 18 7 35-4 45-8 8-20 11-36 11H166c-16 0-28-3-36-11-11-10-14-27-4-45l98-170v-68l-10-8V98z"
        fill="url(#glassBody)" stroke="#67e8f9" stroke-width="11" stroke-linejoin="round" filter="url(#glow3d)" />

  <!-- 3D Liquid Volume & Top Meniscus -->
  <path d="M170 286h172l42 74c8 14 5 26-3 34-6 6-16 8-30 8H161c-14 0-24-2-30-8-8-8-11-20-3-34l42-74z" fill="url(#liquidVol)" />
  <ellipse cx="256" cy="286" rx="88" ry="11" fill="#a5f3fc" fill-opacity="0.78" stroke="#e0f2fe" stroke-width="2.5" />

  <!-- Specular Curved Glass Highlight & 3D Top Rim Lip -->
  <path d="M234 130v66l-86 172c-2 6-3 15 0 21" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round" />
  <rect x="204" y="90" width="104" height="19" rx="9.5" fill="#164e63" fill-opacity="0.85" stroke="#a5f3fc" stroke-width="7" />

  <!-- 3D Rising Bubbles -->
  <circle cx="220" cy="368" r="12" fill="#e0f2fe" fill-opacity="0.45" stroke="#ffffff" stroke-width="2" />
  <circle cx="282" cy="343" r="15" fill="#e0f2fe" fill-opacity="0.42" stroke="#ffffff" stroke-width="2" />
  <circle cx="251" cy="312" r="9.5" fill="#e0f2fe" fill-opacity="0.5" stroke="#ffffff" stroke-width="2" />
  <circle cx="236" cy="251" r="7.5" fill="#e0f2fe" fill-opacity="0.45" stroke="#ffffff" stroke-width="1.8" />
  <circle cx="271" cy="215" r="6.5" fill="#e0f2fe" fill-opacity="0.45" stroke="#ffffff" stroke-width="1.5" />

  <!-- Front Half of 3D Atomic Orbitals (wrapping across liquid) -->
  <g transform="translate(256 286)" filter="url(#glow3d)">
    <path d="M -161 0 A 161 57 0 0 0 161 0" transform="rotate(-28)" fill="none" stroke="url(#orbitGoldFront)" stroke-width="10" stroke-linecap="round" />
    <path d="M -161 0 A 161 57 0 0 0 161 0" transform="rotate(28)" fill="none" stroke="url(#orbitGoldFront)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- 3D Glowing Nucleus & Orbital Electrons -->
  <circle cx="256" cy="286" r="16" fill="#fbbf24" filter="url(#glow3d)" />
  <circle cx="250" cy="280" r="5" fill="#ffffff" />
  <circle cx="117" cy="233" r="12" fill="#fde047" filter="url(#glow3d)" />
  <circle cx="113" cy="229" r="4" fill="#ffffff" />
  <circle cx="395" cy="233" r="12" fill="#38bdf8" filter="url(#glow3d)" />
  <circle cx="391" cy="229" r="4" fill="#ffffff" />
  <circle cx="320" cy="337" r="11" fill="#fbbf24" filter="url(#glow3d)" />
</svg>
