<html lang="tr" dir="ltr">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem("kimya-color-scheme") ?? "light dark";
      } catch (_) {}
    </script>
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kimya YKS 3D" />
    <meta name="description" content="TYT & AYT Kimya 3D Molekül & Kristal Simülasyonu, Çevrimdışı Soru Bankası, Mini Oyunlar ve Sınav Simülatörü" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kimya YKS 3D — TYT & AYT Kimya Laboratuvarı</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
